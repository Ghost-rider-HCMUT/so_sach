[versions]
agp = "8.6.1"
kotlin = "1.9.24"
composeCompiler = "1.5.14"
coreKtx = "1.13.1"
lifecycle = "2.8.4"
activityCompose = "1.9.1"
fragmentKtx = "1.8.2"
